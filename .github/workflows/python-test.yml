# Modified in the ChemEx-JAX fork: NumPy-only / JAX test matrix, type check
# with the jax extra, scheduled exhaustive JAX job, and JAX wheel smoke test.
name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked

      - name: Run linter
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  typecheck:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: Type check Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
          - python-version: "3.14"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies (with the optional JAX backend)
        run: uv sync --locked --extra jax

      - name: Run type checker
        run: uv run ty check --python-version ${{ matrix.python-version }}

  test:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: Test Python ${{ matrix.python-version }} (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        backend: ["numpy", "jax"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked ${{ matrix.backend == 'jax' && '--extra jax' || '' }}

      # Without the extra, JAX tests skip themselves.  With it, the quick JAX
      # set runs; the exhaustive sweep (jax_full) runs in the jax-full job.
      - name: Run tests
        run: uv run pytest -q -n 2 -m "not scientific_acceptance and not jax_full"

  scientific-acceptance:
    name: Scientific acceptance Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
          - python-version: "3.14"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked

      - name: Run scientific acceptance tests
        run: uv run pytest -q -m scientific_acceptance

  jax-full:
    # Exhaustive JAX parity sweep (all examples, all kinetic models): about
    # 1-2 h and several GB per worker, so nightly/manual with one worker.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: JAX exhaustive parity Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies (with the optional JAX backend)
        run: uv sync --locked --extra jax

      - name: Run exhaustive JAX tests
        run: uv run pytest -q -n 1 -m jax_full tests/backend

  package:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: Build and validate package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build distributions
        run: uv build

      - name: Validate distribution metadata
        run: uvx twine check dist/*

      - name: Inspect distribution contents
        run: |
          tar -tzf dist/*.tar.gz
          unzip -l dist/*.whl

      - name: Install and smoke test wheel
        run: |
          uv venv --python 3.13 /tmp/chemex-install
          uv pip install --python /tmp/chemex-install/bin/python dist/*.whl
          /tmp/chemex-install/bin/python -c 'import chemex, importlib.metadata; assert chemex.__version__ == importlib.metadata.version("chemex")'
          /tmp/chemex-install/bin/chemex --help
          /tmp/chemex-install/bin/python -c 'import sys, chemex.backend; assert "jax" not in sys.modules'

      - name: Install and smoke test wheel with the JAX extra
        run: |
          uv venv --python 3.13 /tmp/chemex-jax-install
          uv pip install --python /tmp/chemex-jax-install/bin/python "$(ls dist/*.whl)[jax]"
          /tmp/chemex-jax-install/bin/python -c 'import chemex.jax, jax; assert jax.config.jax_enable_x64'
          /tmp/chemex-jax-install/bin/chemex compare-backends --help
